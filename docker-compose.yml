services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matchcats_profiles_pg16:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: matchcats
      POSTGRES_USER: matchcats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchcats -d matchcats"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matchcats_profiles_pg16:
