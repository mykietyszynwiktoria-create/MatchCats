services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://127.0.0.1:8765,http://localhost:8765}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-framework}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}
      DB_URL: jdbc:postgresql://postgres:5432/matchcats
      DB_USER: matchcats
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-5000}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MODERATOR_ACCOUNT_IDS: ${MODERATOR_ACCOUNT_IDS:-}
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matchcats_profiles_pg16:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: matchcats
      POSTGRES_USER: matchcats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchcats -d matchcats"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matchcats_profiles_pg16:

