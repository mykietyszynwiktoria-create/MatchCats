name: Sync GitHub to GitLab

on:
  push:
    branches:
      - "**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/wiktoria-postgres2/matchcats.git"
          git fetch gitlab "${{ github.ref_name }}"
          git push --force-with-lease gitlab "HEAD:${{ github.ref_name }}"
