name: Sync GitHub to GitLab

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gitlab-main-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/wiktoria-postgres2/matchcats.git"
          git fetch gitlab '+refs/heads/*:refs/remotes/gitlab/*'
          git push --force-with-lease gitlab HEAD:refs/heads/main
