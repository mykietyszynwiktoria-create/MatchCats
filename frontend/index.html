<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155dcc">
  <meta name="description" content="MatchCats breeder workspace for cats, documents and conversations">
  <link rel="manifest" href="manifest.webmanifest">
  <title>MatchCats — panel hodowcy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sky-garden.css">
  <link rel="stylesheet" href="live.css">
</head>
<body>
  <a class="skip" href="#main">Przejdź do treści</a>
  <header class="sidebar">
    <a class="brand" href="#dashboard" aria-label="MatchCats — Start"><svg class="brand-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M12 28 9 7l21 10L51 7l1 24" fill="#7db6fb" stroke="#245b96" stroke-width="3.2" stroke-linejoin="round"/><path d="m15 14 2 14 10-8m20-6-11 7 12 8" fill="#d6e9ff"/><ellipse cx="32" cy="36" rx="25" ry="22" fill="#a9d0ff" stroke="#245b96" stroke-width="3.2"/><path d="M18 35q5-6 10 0m10 0q5-6 10 0" stroke="#245b96" stroke-width="3.2" stroke-linecap="round"/><path d="m28 41 8 0-4 5Z" fill="#d77899"/><path d="M23 47q9 10 18 0" stroke="#245b96" stroke-width="2.5" stroke-linecap="round"/><path d="M17 42 3 39m14 9L3 51m44-9 14-3m-14 9 14 3" stroke="#245b96" stroke-width="2.2" stroke-linecap="round"/></svg><span>Match<span class="brand-accent">Cats</span></span></a>
    <nav id="navigation" aria-label="Główna nawigacja"></nav>
    <div class="topbar-actions"><div class="language-switch" role="group" aria-label="Język / Language"><button type="button" data-language="pl" lang="pl">PL</button><button type="button" data-language="en" lang="en">EN</button></div><button class="avatar" id="top-profile" title="Otwórz ustawienia profilu" aria-label="Otwórz ustawienia profilu">W</button></div>
    <div class="workspace" hidden><strong>Twoja hodowla</strong></div>
    <div class="sidebar-bottom" hidden><strong>Wiktoria</strong></div>
  </header>
  <div class="app-shell">
    <div class="topbar"><div><span class="topbar-label">PANEL HODOWCY</span><span id="breadcrumb">Start</span></div><span class="demo-chip">Wersja demonstracyjna</span></div>
    <main id="main" tabindex="-1"></main>
    <footer>MatchCats · Łączymy hodowców, z troską o koty.<span>Przykładowe dane · Wygenerowane zdjęcia · Zapis lokalny</span></footer>
  </div>
  <dialog id="cat-dialog" aria-labelledby="dialog-title">
    <form id="cat-form"><div class="dialog-heading"><div><span class="eyebrow">TWOJA HODOWLA</span><h2 id="dialog-title">Dodaj profil kota</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Zamknij">×</button></div><p class="muted">W tej wersji profil zapisuje się tylko w tej przeglądarce.</p>
      <label>Imię kota<input name="name" required maxlength="60" placeholder="np. Luna"></label>
      <div class="form-grid"><label>Rasa<select name="breed"><option>Maine Coon</option><option>Ragdoll</option><option>Brytyjski krótkowłosy</option><option>Syberyjski</option></select></label><label>Płeć<select name="sex"><option value="FEMALE">Kotka</option><option value="MALE">Kocur</option></select></label></div>
      <div class="form-grid"><label>Data urodzenia<input type="date" name="birth" required></label><label>Miasto<input name="city" required maxlength="60" placeholder="np. Warszawa"></label></div>
      <label>Opis<textarea name="description" maxlength="1000" rows="3" placeholder="Opowiedz o kocie i warunkach kontaktu"></textarea></label>
      <label class="check"><input type="checkbox" name="available" checked> Pokaż jako dostępnego do rozmowy o kryciu</label>
      <p class="form-error" id="cat-error" role="alert"></p><div class="dialog-footer"><button type="button" class="button secondary" id="cancel-dialog">Anuluj</button><button class="button primary" type="submit">Zapisz profil</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="safety.js"></script>
  <script src="error-pages.js"></script>
  <script src="legal.js"></script>
  <script src="plans.js"></script>
  <script src="live.js"></script>
  <script src="app.js"></script>
</body>
</html>
