spring.application.name=matchcats
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchcats}
spring.datasource.username=${DB_USER:matchcats}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
